<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webポータル構成図</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F5F7F9;
  --surface:#FFFFFF;
  --surface-2:#EAEEF3;
  --ink:#141A21;
  --ink-2:#38434F;
  --muted:#6B7784;
  --rule:#D6DCE4;
  --rule-soft:#E6EAEF;
  --teal:#2F6E70;
  --teal-wash:#E3EEEE;
  --amber:#AF6210;
  --amber-wash:#F9EEDE;
  --built:#3F7A52;
  --built-wash:#E7F1EA;
  --alert:#A5382A;
  --alert-wash:#F7E7E4;
  --sans:'IBM Plex Sans','Noto Sans JP',-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;
  --mono:'IBM Plex Mono','Noto Sans JP',ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1319;
    --surface:#161C24;
    --surface-2:#1D242E;
    --ink:#E5EAF0;
    --ink-2:#B7C1CC;
    --muted:#8794A2;
    --rule:#2A3441;
    --rule-soft:#212A35;
    --teal:#6CBAB8;
    --teal-wash:#16302F;
    --amber:#E19B48;
    --amber-wash:#332510;
    --built:#7BC496;
    --built-wash:#17281D;
    --alert:#E2887A;
    --alert-wash:#361E1A;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1319;
  --surface:#161C24;
  --surface-2:#1D242E;
  --ink:#E5EAF0;
  --ink-2:#B7C1CC;
  --muted:#8794A2;
  --rule:#2A3441;
  --rule-soft:#212A35;
  --teal:#6CBAB8;
  --teal-wash:#16302F;
  --amber:#E19B48;
  --amber-wash:#332510;
  --built:#7BC496;
  --built-wash:#17281D;
  --alert:#E2887A;
  --alert-wash:#361E1A;
}

*{box-sizing:border-box}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px 96px}

section{padding-top:56px}
code{
  font-family:var(--mono);font-size:.86em;
  background:var(--surface-2);padding:.12em .38em;border-radius:2px;
  color:var(--ink-2);word-break:break-word
}

/* ---------- figure ---------- */
figure{margin:0 0 8px}
.figframe{
  background:var(--surface);border:1px solid var(--rule);
  padding:22px 20px 16px;overflow-x:auto
}
.figframe svg{display:block;width:100%;min-width:900px;height:auto}
.legend{
  display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--rule-soft);font-size:12px;color:var(--muted)
}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:18px;height:11px;border-width:1.25px;border-style:solid;flex:none}
.sw-built{background:var(--built-wash);border-color:var(--built)}
.sw-new{background:var(--amber-wash);border-color:var(--amber)}
.sw-flat{background:var(--surface-2);border-color:var(--rule)}
.sw-line{width:20px;height:0;border:0;border-top:1.8px solid var(--alert)}

/* ---------- svg tokens ---------- */
.dg text{font-family:var(--sans);font-size:12px;fill:var(--ink)}
.dg .m{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.dg .s{font-size:10.5px;fill:var(--muted)}
.dg .zlab{font-size:10.5px;fill:var(--muted);letter-spacing:.05em}
.dg .b{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.dg .b-new{fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.25}
.dg .b-flat{fill:var(--surface-2);stroke:var(--rule);stroke-width:1}
.dg .zone{fill:none;stroke:var(--rule);stroke-width:1;stroke-dasharray:7 4}
.dg .zone-i{fill:var(--surface-2);stroke:var(--rule-soft);stroke-width:1;stroke-dasharray:4 3}
.dg .ln{fill:none;stroke:var(--muted);stroke-width:1.4}
.dg .ln-n{fill:none;stroke:var(--amber);stroke-width:1.8}
.dg .ln-a{fill:none;stroke:var(--alert);stroke-width:1.8}
.dg .ln-d{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4}
.dg .fm{fill:var(--muted)}
.dg .fn{fill:var(--amber)}
.dg .fa{fill:var(--alert)}
.dg .em-a{fill:var(--alert);font-size:10.5px}
.dg .em-n{fill:var(--amber);font-size:10.5px}
.dg .em-b{fill:var(--built);font-size:10.5px}

@media (max-width:640px){
  .wrap{padding:0 18px 72px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">

<section>
  <figure>
    <div class="figframe">
      <svg class="dg" viewBox="0 0 1280 1260" role="img" aria-label="Webポータルの構成図。依頼者(クライアント)はCloudFront＋WAF経由でアクセスし、静的コンテンツはS3(ポータルSPA)、/api/*はVPC Origin経由で公開ALB(443)・公開ECSサービスに到達する。VPC Latticeはアカウントレベルの管理基盤としてVPCの外側に描かれ、IAM認証・認可のうえ公開ALBとは別リソースの専用アカウント発行ALB(443)・アカウント発行ECSサービスへ到達する。公開・アカウント発行の2 ECSサービスは同一のAuroraクラスタを共用するが、ALB・ターゲットグループ・タスクロールはそれぞれ独立している。VPCはLatticeサービスネットワークへ関連付けられる。ネットワークSG・ログバケット・ACM証明書・Cognito(dev)・SESドメインIDは構築済み、ALB・ECS・CloudFront・WAF・VPC Lattice・Custom Email Sender・SNSは未構築。">
        <defs>
          <marker id="a-mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="fm"/></marker>
          <marker id="a-mkn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="fn"/></marker>
          <marker id="a-mka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="fa"/></marker>
        </defs>

        <!-- VPC Lattice: account-level construct, drawn OUTSIDE the VPC boundary.
             Account-issuance requests arrive via the Lattice managed prefix list,
             are authenticated/authorized by Lattice (IAM), then enter the VPC to
             reach the dedicated account-issuing ALB target (not the public ALB).
             It is not a subnet-resident resource. -->
        <rect class="b-new" x="435" y="300" width="410" height="92"/>
        <text x="640" y="324" text-anchor="middle">VPC Lattice</text>
        <text class="s" x="640" y="342" text-anchor="middle">サービスネットワーク・サービス・auth policy(IAM)</text>
        <text class="s" x="640" y="360" text-anchor="middle">アカウントレベルの管理基盤・特定のVPCに属さない</text>
        <text class="em-n" x="640" y="380" text-anchor="middle">未構築</text>

        <!-- zones -->
        <rect class="zone" x="310" y="410" width="670" height="606"/>
        <text class="zlab" x="324" y="432">VPC  10.0.0.0/16（prd）／ 3AZ（ap-northeast-1a・1c・1d）</text>
        <text class="s" x="960" y="432" text-anchor="end">VPC 関連付け（Lattice サービスネットワークへ）</text>
        <rect class="zone-i" x="340" y="462" width="610" height="104"/>
        <text class="zlab" x="354" y="480">パブリックサブネット</text>
        <rect class="zone-i" x="340" y="584" width="610" height="300"/>
        <text class="zlab" x="354" y="602">プライベートサブネット</text>

        <!-- users -->
        <rect class="b" x="490" y="20" width="300" height="52"/>
        <text x="640" y="43" text-anchor="middle">依頼者（クライアント）</text>
        <text class="s" x="640" y="60" text-anchor="middle">インターネット全域・IP制限不可</text>

        <!-- cloudfront -->
        <rect class="b-new" x="270" y="116" width="160" height="70"/>
        <text class="s" x="350" y="138" text-anchor="middle">CF Function ＋ KVS</text>
        <text class="s" x="350" y="156" text-anchor="middle">メンテ503／accounts遮断</text>
        <text class="em-n" x="350" y="175" text-anchor="middle">未構築</text>
        <line class="ln-d" x1="430" y1="151" x2="486" y2="151"/>

        <rect class="b-new" x="490" y="112" width="300" height="78"/>
        <text x="640" y="136" text-anchor="middle">CloudFront ＋ WAF</text>
        <text class="m" x="640" y="154" text-anchor="middle">ares. / aegis.portal.a1-sys.jp</text>
        <text class="em-n" x="640" y="173" text-anchor="middle">未構築（a1-sys.jp 再利用）</text>

        <!-- s3 -->
        <rect class="b-new" x="490" y="232" width="300" height="54"/>
        <text x="640" y="255" text-anchor="middle">S3（ポータルSPA）</text>
        <text class="s" x="640" y="273" text-anchor="middle">事務所別プレフィックス・未構築</text>

        <!-- public subnet contents -->
        <rect class="b-flat" x="370" y="494" width="200" height="64"/>
        <text x="470" y="519" text-anchor="middle">NAT Gateway ×3</text>
        <text class="s" x="470" y="538" text-anchor="middle">固定EIP</text>
        <rect class="b-flat" x="800" y="502" width="110" height="32"/>
        <text class="s" x="855" y="522" text-anchor="middle">IGW</text>
        <text class="em-n" x="685" y="530" text-anchor="middle">ポータルはパブリックサブネットを使わない</text>

        <!-- private subnet contents -->
        <rect class="b-new" x="490" y="624" width="140" height="76"/>
        <text x="560" y="648" text-anchor="middle">公開ALB</text>
        <text class="m" x="560" y="664" text-anchor="middle">443・/api/*</text>
        <text class="em-n" x="560" y="682" text-anchor="middle">未構築</text>

        <rect class="b-new" x="650" y="624" width="140" height="76"/>
        <text x="720" y="644" text-anchor="middle">アカウント発行</text>
        <text x="720" y="660" text-anchor="middle">ALB</text>
        <text class="em-n" x="720" y="678" text-anchor="middle">未構築</text>
        <text class="s" x="720" y="694" text-anchor="middle">Lattice経由のみ</text>

        <rect class="b-new" x="490" y="708" width="140" height="64"/>
        <text x="560" y="728" text-anchor="middle">公開ECS</text>
        <text class="s" x="560" y="744" text-anchor="middle">d3/min3/max9</text>
        <text class="em-n" x="560" y="760" text-anchor="middle">未構築</text>

        <rect class="b-new" x="650" y="708" width="140" height="64"/>
        <text x="720" y="728" text-anchor="middle">発行ECS</text>
        <text class="s" x="720" y="744" text-anchor="middle">d2/min2/max4</text>
        <text class="em-n" x="720" y="760" text-anchor="middle">未構築</text>

        <text class="s" x="560" y="782" text-anchor="middle">同一イメージ・SERVICE_ROLEで出し分け（未確定）</text>

        <rect class="b-new" x="490" y="792" width="300" height="64"/>
        <text x="640" y="814" text-anchor="middle">Custom Email Sender</text>
        <text class="s" x="640" y="832" text-anchor="middle">Lambda ＋ KMS・未構築</text>

        <!-- aurora -->
        <rect class="b-flat" x="420" y="910" width="440" height="76"/>
        <text x="640" y="934" text-anchor="middle">Aurora PostgreSQL（共用クラスタ）</text>
        <text class="s" x="640" y="952" text-anchor="middle">portal スキーマ新設</text>
        <text class="em-b" x="640" y="970" text-anchor="middle">3ロール払い出し済み（2026-09-07）</text>

        <!-- external services -->
        <text class="zlab" x="60" y="1052">VPC外のAWSサービス</text>
        <rect class="b-flat" x="60" y="1062" width="1160" height="52"/>
        <line x1="350" y1="1062" x2="350" y2="1114" stroke="var(--rule)" stroke-width="1"/>
        <line x1="640" y1="1062" x2="640" y2="1114" stroke="var(--rule)" stroke-width="1"/>
        <line x1="930" y1="1062" x2="930" y2="1114" stroke="var(--rule)" stroke-width="1"/>
        <text x="205" y="1084" text-anchor="middle">Cognito（dev）</text>
        <text class="em-b" x="205" y="1102" text-anchor="middle">構築済み</text>
        <text x="495" y="1084" text-anchor="middle">Cognito（prd）</text>
        <text class="em-n" x="495" y="1102" text-anchor="middle">未構築</text>
        <text x="785" y="1084" text-anchor="middle">SES ドメインID（prd）</text>
        <text class="em-b" x="785" y="1102" text-anchor="middle">構築済み・DKIM検証済み</text>
        <text x="1095" y="1084" text-anchor="middle">SNS（SMS）</text>
        <text class="em-n" x="1095" y="1102" text-anchor="middle">未構築</text>

        <rect class="b-flat" x="60" y="1126" width="1160" height="52"/>
        <line x1="350" y1="1126" x2="350" y2="1178" stroke="var(--rule)" stroke-width="1"/>
        <line x1="640" y1="1126" x2="640" y2="1178" stroke="var(--rule)" stroke-width="1"/>
        <line x1="930" y1="1126" x2="930" y2="1178" stroke="var(--rule)" stroke-width="1"/>
        <text x="205" y="1148" text-anchor="middle">Secrets Manager</text>
        <text class="s" x="205" y="1166" text-anchor="middle">dev Cognito分のみ構築済み</text>
        <text x="495" y="1148" text-anchor="middle">ECR</text>
        <text class="em-n" x="495" y="1166" text-anchor="middle">未構築（モジュールのみ存在）</text>
        <text x="785" y="1148" text-anchor="middle">ログ用S3バケット4種</text>
        <text class="em-b" x="785" y="1166" text-anchor="middle">構築済み</text>
        <text x="1095" y="1148" text-anchor="middle">CloudWatch Logs</text>
        <text class="s" x="1095" y="1166" text-anchor="middle">共有サービス</text>

        <!-- flows: new (public) -->
        <line class="ln-n" x1="640" y1="72" x2="640" y2="108" marker-end="url(#a-mkn)"/>
        <line class="ln-n" x1="640" y1="190" x2="640" y2="228" marker-end="url(#a-mkn)"/>
        <text class="em-n" x="650" y="213">OAC</text>
        <polyline class="ln-n" points="790,150 950,150 950,662 634,662" marker-end="url(#a-mkn)"/>
        <text class="em-n" x="942" y="300" text-anchor="end">VPC Origin</text>
        <text class="m" x="942" y="316" text-anchor="end">/api/*</text>
        <line class="ln-n" x1="560" y1="700" x2="560" y2="708" marker-end="url(#a-mkn)"/>
        <line class="ln-n" x1="720" y1="700" x2="720" y2="708" marker-end="url(#a-mkn)"/>
        <text class="s" x="605" y="705" text-anchor="middle">:3000</text>
        <polyline class="ln-n" points="560,772 560,780 810,780 810,946 864,946" marker-end="url(#a-mkn)"/>
        <text class="em-n" x="802" y="870" text-anchor="end">reader分離</text>
        <text class="s" x="802" y="886" text-anchor="end">接続数上限明示</text>

        <!-- flows: internal API (IAM) — requests authenticated/authorized by
             VPC Lattice (outside the VPC boundary) enter the VPC to reach the
             dedicated account-issuance ALB (separate resource from the public
             ALB). AWS内のプライベート経路（NAT非経由）. -->
        <line class="ln-a" x1="740" y1="392" x2="740" y2="624" marker-end="url(#a-mka)"/>
        <text class="em-a" x="750" y="470" text-anchor="start">IAM認可</text>
        <text class="s" x="750" y="486" text-anchor="start">（AWS内のプライベート経路・NAT非経由）</text>

        <!-- flows: NAT egress to external services (shared) -->
        <polyline class="ln-d" points="570,558 570,1042" marker-end="url(#a-mk)"/>
        <text class="s" x="580" y="1030">NAT GW 経由</text>
      </svg>

      <div class="legend">
        <span><i class="sw sw-built"></i>ポータル・構築済み（apply 済み）</span>
        <span><i class="sw sw-new"></i>ポータル・未構築（設計のみ）</span>
        <span><i class="sw sw-flat"></i>共有・中立リソース</span>
        <span><i class="sw sw-line"></i>VPC Lattice 経由の内部 API（IAM 認証）</span>
      </div>
    </div>
  </figure>
</section>

</div>
</body>
</html>
